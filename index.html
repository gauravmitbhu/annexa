<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Acme ISMS Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233B1A6B'/%3E%3Ctext x='16' y='23' font-family='sans-serif' font-size='19' font-weight='800' fill='%23E91E63' text-anchor='middle'%3Ea%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--gray-50);
    color: var(--gray-900);
    font-family: 'Poppins', system-ui, sans-serif;
    overflow: hidden;
  }
  #root { height: 100vh; }
  /* utility */
  .scroll-y { overflow-y: auto; }
  .scroll-y::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-y::-webkit-scrollbar-thumb { background: rgba(107,47,160,0.18); border-radius: 4px; }
  .scroll-y::-webkit-scrollbar-track { background: transparent; }

  /* shimmer */
  @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
  .skeleton {
    background: linear-gradient(90deg, #F3F4F6 0%, #E5E7EB 40%, #F3F4F6 80%);
    background-size: 800px 100%;
    animation: shimmer 1.6s infinite linear;
    border-radius: 6px;
  }
  /* dot pulse */
  @keyframes dot-pulse { 0%,80%,100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #6B2FA0; margin: 0 2px; animation: dot-pulse 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.15s; }
  .dot:nth-child(3) { animation-delay: 0.3s; }

  /* sparkle pulse */
  @keyframes sparkle-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  .sparkle-pulse { animation: sparkle-pulse 2.4s infinite ease-in-out; }

  /* link styling */
  a.row-link { color: inherit; text-decoration: none; }

  /* hide scrollbar visually but keep scrollable for chips row */
  .chips-row::-webkit-scrollbar { display: none; }

  /* chat input focus ring */
  textarea.composer:focus { outline: none; box-shadow: 0 0 0 3px rgba(107,47,160,0.18); border-color: #6B2FA0 !important; }

  /* tooltip */
  .tt { position: relative; }
  .tt:hover .tt-body { opacity: 1; transform: translate(-50%, -8px); pointer-events: auto; }
  .tt-body {
    position: absolute; left: 50%; bottom: 100%;
    transform: translate(-50%, 0px);
    background: #111827; color: #fff; font-size: 11px;
    padding: 8px 10px; border-radius: 6px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: all 120ms;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  .tt-body::after {
    content: ''; position: absolute; left: 50%; top: 100%;
    transform: translateX(-50%);
    border: 4px solid transparent; border-top-color: #111827;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.544.0/dist/umd/lucide.min.js"></script>

<!-- Protected engine only — everything else (site spec, data, widgets) is
     discovered via /api/manifest and loaded dynamically by engine/loader.jsx -->
<script type="text/babel" src="engine/registry.jsx"></script>
<script type="text/babel" src="engine/primitives.jsx"></script>
<script type="text/babel" src="engine/ai-panel.jsx"></script>
<script type="text/babel" src="engine/renderer.jsx"></script>
<script type="text/babel" src="engine/loader.jsx"></script>

<script>
// Live-reload: poll /api/version every 2s; reload if files changed
(function () {
  let known = null;
  setInterval(async () => {
    try {
      const r = await fetch('/api/version');
      const { v } = await r.json();
      if (known === null) { known = v; return; }
      if (v !== known) location.reload();
    } catch(e) {}
  }, 2000);
})();
</script>
</body>
</html>
